[package]
name = "deadlib-render-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[features]
test-util = []

[[test]]
name = "frame_compare"
required-features = ["test-util"]

[[bench]]
name = "texture_retirement_storage"
harness = false

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = "0.33.3"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }

[lints.clippy]
perf = { level = "warn", priority = -1 }

inline_always = "allow"
