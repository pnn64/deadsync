[package]
name = "deadlib-render-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[features]
bench-support = []
test-util = []

[[test]]
name = "frame_compare"
required-features = ["test-util"]

[[bench]]
name = "texture_retirement_storage"
harness = false

[[bench]]
name = "graphics_hot_paths"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "graphics_hot_paths_followup"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "graphics_upload_hot_paths"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "graphics_command_hot_paths"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "graphics_pipeline_fifth_pass"
harness = false
required-features = ["bench-support"]

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = "0.33.5"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }

[lints.clippy]
perf = { level = "warn", priority = -1 }

inline_always = "allow"
