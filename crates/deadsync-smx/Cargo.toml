[package]
name = "deadsync-smx"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[dependencies]
deadsync-core = { path = "../deadsync-core" }
deadlib-platform = { path = "../deadlib-platform" }
deadlib-image-io = { path = "../deadlib-image-io" }
hashbrown = "0.17.1"
# Keep Cargo updates on the workspace's HID adapter for the SDK.
hidapi = { version = "=2.6.7", default-features = false }
log = "0.4.35"
rustmaniax-sdk = "2.1.1"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["gif"] }

[lints.clippy]
perf = { level = "warn", priority = -1 }

inline_always = "allow"
