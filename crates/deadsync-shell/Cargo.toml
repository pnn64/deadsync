[package]
name = "deadsync-shell"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[features]
bench-support = [
    "deadsync-input-native/bench-support",
]

[[bench]]
name = "dynamic_media_completion_budget"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "dynamic_media_reconcile_hot_paths"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "content_worker_hot_paths"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "input_capture_maintenance"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "runtime_view_invalidation"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "screen_service_gating"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "profile_import_progress"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "score_import_handoff"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "sync_analysis_event_batches"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "content_catalog_hot_paths"
harness = false
required-features = ["bench-support"]


[dependencies]
deadlib-assets = { path = "../deadlib-assets" }
deadlib-platform = { path = "../deadlib-platform" }
deadlib-present = { path = "../deadlib-present" }
deadlib-render-core = { path = "../deadlib-render-core" }
deadlib-render = { path = "../deadlib-render" }
deadlib-video = { path = "../deadlib-video" }
deadsync-assets = { path = "../deadsync-assets" }
deadlib-audio-core = { path = "../deadlib-audio-core" }
deadsync-audio-decode = { path = "../deadsync-audio-decode" }
deadsync-audio-replaygain = { path = "../deadsync-audio-replaygain" }
deadsync-audio-stream = { path = "../deadsync-audio-stream" }
deadsync-chart = { path = "../deadsync-chart" }
deadsync-config = { path = "../deadsync-config" }
deadsync-core = { path = "../deadsync-core" }
deadsync-gameplay = { path = "../deadsync-gameplay" }
deadsync-heart-rate = { path = "../deadsync-heart-rate" }
deadsync-input = { path = "../deadsync-input" }
deadsync-input-fsr = { path = "../deadsync-input-fsr" }
deadsync-input-native = { path = "../deadsync-input-native" }
deadsync-import = { path = "../deadsync-import" }
deadsync-lights = { path = "../deadsync-lights" }
deadsync-noteskin = { path = "../deadsync-noteskin" }
deadsync-online = { path = "../deadsync-online" }
deadsync-profile = { path = "../deadsync-profile" }
deadsync-profile-gameplay = { path = "../deadsync-profile-gameplay" }
deadsync-rules = { path = "../deadsync-rules" }
deadsync-score = { path = "../deadsync-score" }
deadsync-simfile = { path = "../deadsync-simfile" }
deadsync-smx = { path = "../deadsync-smx" }
deadsync-song-lua = { path = "../deadsync-song-lua" }
deadsync-theme = { path = "../deadsync-theme" }
deadsync-theme-simply-love = { path = "../deadsync-theme-simply-love" }
deadsync-updater = { path = "../deadsync-updater" }
image = "0.25.10"
hashbrown = "0.17.1"
log = "0.4.34"
null-or-die = { git = "https://github.com/pnn64/null-or-die", branch = "main" }
rfd = "0.17.2"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
smallvec = "1.15.2"
winit = "0.30.13"

[dev-dependencies]
deadsync-notefield = { path = "../deadsync-notefield" }
deadsync-theme-simply-love = { path = "../deadsync-theme-simply-love", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", features = ["relax-sign-encoding"] }
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

[lints.clippy]
perf = { level = "warn", priority = -1 }

inline_always = "allow"
