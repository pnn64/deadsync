[package]
name = "deadlib-assets"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[dependencies]
deadlib-image-io = { path = "../deadlib-image-io" }
deadlib-present = { path = "../deadlib-present" }
deadlib-render-core = { path = "../deadlib-render-core" }
deadlib-image = { path = "../deadlib-image" }
log = "0.4.35"
memchr = "2.8.3"
rustc-hash = "2.1.3"
twox-hash = "2.1.5"

[dev-dependencies]
deadlib-render = { path = "../deadlib-render" }
gif = "0.14.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde_json = { workspace = true }
winit = "0.30.13"

[lints.clippy]
perf = { level = "warn", priority = -1 }

inline_always = "allow"
