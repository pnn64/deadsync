[package]
name = "deadsync-song-lua"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[features]
bench-support = []

[dependencies]
deadlib-assets = { path = "../deadlib-assets" }
deadlib-present = { path = "../deadlib-present" }
chrono = "0.4.45"
image = "0.25.10"
log = "0.4.34"
memchr = "2.8.3"
mlua = { version = "0.12.0", features = ["lua54", "vendored"] }
rustc-hash = "2.1.3"
serde_json = "1.0.151"
smallvec = "1.15.2"

[lints.clippy]
perf = { level = "warn", priority = -1 }

inline_always = "allow"

[[bench]]
name = "runtime_mod_sustain_hot_paths"
harness = false

[[bench]]
name = "runtime_mod_dedup_hot_paths"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "actor_pointer_match_hot_paths"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "compat_file_lookup_hot_paths"
harness = false
required-features = ["bench-support"]
