[package]
name = "deadsync-input-fsr"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[dependencies]
arrayvec = "0.7.8"
deadsync-input = { path = "../deadsync-input" }
deadsync-smx = { path = "../deadsync-smx" }
deadsync-reflex = { path = "../deadsync-reflex" }
log = "0.4.35"
deadlib-platform = { path = "../deadlib-platform" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(any(windows, target_os = "linux", target_os = "freebsd", target_os = "macos"))'.dependencies]
deadlib-hid = { path = "../deadlib-hid" }
serialport = { version = "4.10.1", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
perf = { level = "warn", priority = -1 }

inline_always = "allow"
