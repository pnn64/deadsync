[package]
name = "png-decode-bench"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
allocations = []

[dependencies]
deadlib-image-png = { path = ".." }
png = "=0.18.1"
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
