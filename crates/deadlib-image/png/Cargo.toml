[package]
name = "deadlib-image-png"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0"
description = "Independent pure-Rust PNG codec with native zlib and DEFLATE"
repository = "https://github.com/pnn64/deadsync"

[dependencies]
deadlib-image = { path = "..", version = "0.1.0" }

[dev-dependencies]
png = "0.18.1"
flate2 = "1.1.10"

[lints.clippy]
perf = { level = "warn", priority = -1 }
