[package]
name = "jpeg-decode-bench"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[features]
allocations = []
[dependencies]
deadlib-image-jpeg = { path = ".." }
native_samples = { package = "deadlib-image", path = "../.." }
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
zune-jpeg = "=0.5.15"
zune-core = "=0.5.3"
jpeg-decoder = "=0.3.2"
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
