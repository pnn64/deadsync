[package]
name = "bmp-pass2-validation"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
name = "deadlib_image_bmp"
path = "../../../crates/deadlib-image/bmp/src/lib.rs"

[[test]]
name = "bmp_decode"
path = "../../../crates/deadlib-image/bmp/tests/bmp_decode.rs"

[[test]]
name = "bmp_encode"
path = "../../../crates/deadlib-image/bmp/tests/bmp_encode.rs"

[[test]]
name = "bmp_model"
path = "../../../crates/deadlib-image/bmp/tests/bmp_model.rs"

[[test]]
name = "bmp_optimized"
path = "../../../crates/deadlib-image/bmp/tests/bmp_optimized.rs"

[[test]]
name = "bmp_owned"
path = "../../../crates/deadlib-image/bmp/tests/bmp_owned.rs"

[[test]]
name = "alpha_controls"
path = "alpha_controls.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = 1

[lints.clippy]
perf = "warn"
