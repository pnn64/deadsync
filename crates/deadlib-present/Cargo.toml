[package]
name = "deadlib-present"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[features]
bench-support = []

[dependencies]
deadlib-render-core = { path = "../deadlib-render-core" }
glam = "0.33.5"
image = "0.25.10"
log = "0.4.34"
smallvec = "1.15.2"
rustc-hash = "2.1.3"

[lints.clippy]
perf = { level = "warn", priority = -1 }

inline_always = "allow"

[[bench]]
name = "internal_hashing"
harness = false

[[bench]]
name = "frame_lookup_hot_paths"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "marker_replacement_hot_paths"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "animation_tween_hot_paths"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "font_startup_hot_paths"
harness = false
required-features = ["bench-support"]
