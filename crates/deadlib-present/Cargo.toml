[package]
name = "deadlib-present"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[features]
conformance = []

[dependencies]
deadlib-image-io = { path = "../deadlib-image-io" }
deadlib-render-core = { path = "../deadlib-render-core" }
glam = "0.34.3"
log = "0.4.35"
memchr = "2.8.3"
smallvec = "1.16.5"
rustc-hash = "2.1.3"

[dev-dependencies]
deadlib-render-core = { path = "../deadlib-render-core", features = ["test-util"] }

[lints.clippy]
perf = { level = "warn", priority = -1 }

inline_always = "allow"

