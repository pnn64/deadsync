[package]
name = "deadsync-updater"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[dependencies]
deadlib-platform = { path = "../deadlib-platform" }
deadsync-noteskin = { path = "../deadsync-noteskin" }
deadsync-version = { path = "../deadsync-version" }
flate2 = "1.1.10"
log = "0.4.34"
rand = "0.10.3"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
ureq = { version = "3.5.0", features = ["json", "rustls"] }
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "macos"))'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[lints.clippy]
perf = { level = "warn", priority = -1 }

inline_always = "allow"
