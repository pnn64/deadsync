[package]
name = "deadlib-audio-decode-mp3-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
deadlib-audio-decode-mp3 = { path = ".." }

[[bin]]
name = "frames"
path = "fuzz_targets/frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "streams"
path = "fuzz_targets/streams.rs"
test = false
doc = false
bench = false
