[package]
name = "deadsync-input"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[features]
bench-support = []

[[bench]]
name = "input_pipeline_hot_paths"
harness = false

[[bench]]
name = "input_config_hot_paths"
harness = false
required-features = ["bench-support"]

[dependencies]
deadsync-core = { path = "../deadsync-core" }
log = "0.4.33"
rustc-hash = "2.1.3"
winit = "0.30.13"

[lints.clippy]
perf = { level = "warn", priority = -1 }

inline_always = "allow"
