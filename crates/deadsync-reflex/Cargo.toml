[package]
name = "deadsync-reflex"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[dependencies]
deadlib-platform = { path = "../deadlib-platform" }
deadlib-input-native = { path = "../deadlib-input-native" }
deadsync-input = { path = "../deadsync-input" }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["linux-static-hidraw"] }
[target.'cfg(target_os = "freebsd")'.dependencies]
hidapi = { version = "2.6.7", default-features = false }
[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["macos-shared-device"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
perf = { level = "warn", priority = -1 }
