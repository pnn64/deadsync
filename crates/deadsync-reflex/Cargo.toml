[package]
name = "deadsync-reflex"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[dependencies]
deadlib-platform = { path = "../deadlib-platform" }
deadsync-input = { path = "../deadsync-input" }
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(any(windows, target_os = "linux", target_os = "freebsd", target_os = "macos"))'.dependencies]
deadlib-hid = { path = "../deadlib-hid", features = ["macos-shared-device"] }

[lints.clippy]
perf = { level = "warn", priority = -1 }
