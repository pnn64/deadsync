[package]
name = "deadsync-theme-simply-love"
version.workspace = true
edition = "2024"
license = "GPL-3.0"

[features]
bench-support = [
    "deadsync-config/bench-support",
    "deadsync-notefield/bench-support",
    "deadsync-simfile/bench-support",
]
test-support = []

[[bench]]
name = "gameplay_frame_orchestration"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "song_lua_layer_activity_hot_paths"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "gameplay_boundary_prewarm"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "gameplay_numeric_text_prewarm"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "gameplay_numeric_text_memo"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "direct_notefield_presentation"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "song_lua_aft_capture"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "song_lua_overlay_sampling_hot_paths"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "song_lua_state_index_hot_paths"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "select_music_hot_paths"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "select_music_lobby_reconcile"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "screen_allocation_hot_paths"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "evaluation_actor_hot_paths"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "screen_bar_hot_paths"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "profile_picker_hot_paths"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "manage_profiles_hot_paths"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "options_overlay_hot_paths"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "song_search_hot_paths"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "step_stats_lua_parse_hot_paths"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "i18n_format_hot_paths"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "event_text_layout_hot_paths"
harness = false
required-features = ["bench-support"]

[dependencies]
deadlib-assets = { path = "../deadlib-assets" }
deadlib-present = { path = "../deadlib-present" }
deadlib-render-core = { path = "../deadlib-render-core" }
deadsync-assets = { path = "../deadsync-assets" }
deadsync-chart = { path = "../deadsync-chart" }
deadsync-config = { path = "../deadsync-config" }
deadsync-core = { path = "../deadsync-core" }
deadsync-gameplay = { path = "../deadsync-gameplay" }
deadsync-input = { path = "../deadsync-input" }
deadsync-notefield = { path = "../deadsync-notefield" }
deadsync-noteskin = { path = "../deadsync-noteskin" }
deadsync-online = { path = "../deadsync-online" }
deadsync-profile = { path = "../deadsync-profile" }
deadsync-profile-gameplay = { path = "../deadsync-profile-gameplay" }
deadsync-rules = { path = "../deadsync-rules" }
deadsync-score = { path = "../deadsync-score" }
deadsync-simfile = { path = "../deadsync-simfile" }
deadsync-song-lua = { path = "../deadsync-song-lua" }
deadsync-theme = { path = "../deadsync-theme" }
deadsync-version = { path = "../deadsync-version" }
bitflags = "2.13.1"
chrono = "0.4.45"
glam = "0.33.5"
image = "0.25.10"
log = "0.4.34"
mlua = { version = "0.12.0", features = ["lua54", "vendored"] }
qrcodegen = "1.8.0"
rand = "0.10.2"
rustc-hash = "2.1.3"
smallvec = "1.15.2"
strsim = "0.11.1"
twox-hash = "2.1.3"
unicode-normalization = "0.1.25"

[dev-dependencies]
deadlib-render-core = { path = "../deadlib-render-core", features = ["test-util"] }
deadlib-render = { path = "../deadlib-render" }
deadsync-notefield = { path = "../deadsync-notefield" }
serde_json = "1.0.149"
winit = "0.30.13"

[lints.clippy]
perf = { level = "warn", priority = -1 }

inline_always = "allow"
