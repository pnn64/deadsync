<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simply Love Exports · Gameplay</title>
  <link rel="stylesheet" href="gameplay.css">
</head>
<body>
  <header class="page-header">
    <div class="brand">
      <h1>Simply Love Exports</h1>
      <p>Gameplay</p>
    </div>
    <nav class="gallery-nav" aria-label="Export galleries">
      <a href="../menu-exports/index.html">Menus</a>
      <a href="../gameplay-exports/index.html" aria-current="page">Gameplay</a>
    </nav>
  </header>
  <main>
  <div class="filters" id="gallery-filters">
    <fieldset>
      <legend>Layout</legend>
      <div class="filter-tabs">
        {% for layout in layouts %}
        <label class="filter-tab">
          <input type="checkbox" data-filter-group="layout" data-filter-value="{{ layout.value }}" checked>
          {{ layout.label }}
        </label>
        {% endfor %}
      </div>
    </fieldset>
    <fieldset>
      <legend>Resolution</legend>
      <div class="filter-tabs">
        {% for resolution in resolutions %}
        <label class="filter-tab">
          <input type="checkbox" data-filter-group="resolution" data-filter-value="{{ resolution.value }}" checked>
          {{ resolution.value }}
        </label>
        {% endfor %}
      </div>
    </fieldset>
    <fieldset>
      <legend>Variants</legend>
      <div class="filter-tabs">
        <label class="filter-tab">
          <input type="checkbox" data-filter-group="center" data-filter-value="1p" checked>
          Center 1P
        </label>
        <label class="filter-tab">
          <input type="checkbox" data-filter-group="variant" data-filter-value="hmr" checked>
          HMR
        </label>
        <label class="filter-tab">
          <input type="checkbox" data-filter-group="variant" data-filter-value="leaderboard" checked>
          Leaderboard
        </label>
      </div>
    </fieldset>
    <button type="button" id="reset-filters">Reset filters</button>
  </div>

  {% for section in sections %}
  <section class="pair" data-layout="{{ section.layout }}" data-resolution="{{ section.resolution }}" data-centered="{{ section.centered }}">
    {% for image in section.images %}
    <figure data-variant="{{ image.variant }}">
      <figcaption>{{ image.caption }}</figcaption>
      <a href="{{ image.src }}"><img loading="lazy" src="{{ image.src }}" alt="{{ image.caption }}"></a>
    </figure>
    {% endfor %}
  </section>
  {% endfor %}
  </main>

  <script>
    (() => {
      const storageKey = 'gameplayGalleryFilters';
      const controls = [...document.querySelectorAll('#gallery-filters input[type=checkbox]')];
      const sections = [...document.querySelectorAll('section[data-layout][data-resolution]')];
      const key = control => control.dataset.filterGroup + ':' + control.dataset.filterValue;

      const apply = () => {
        const enabled = new Map(controls.map(control => [key(control), control.checked]));
        for (const section of sections) {
          const singlePlayer = section.dataset.layout === 'p1' || section.dataset.layout === 'p2';
          section.hidden = !(
            enabled.get('layout:' + section.dataset.layout)
            && (!singlePlayer || enabled.get('layout:single'))
            && enabled.get('resolution:' + section.dataset.resolution)
            && (section.dataset.centered !== 'true' || enabled.get('center:1p'))
          );
          for (const figure of section.querySelectorAll('figure[data-variant]')) {
            figure.hidden = !enabled.get('variant:' + figure.dataset.variant);
          }
        }
      };

      const save = () => {
        const preferences = Object.fromEntries(controls.map(control => [key(control), control.checked]));
        try {
          localStorage.setItem(storageKey, JSON.stringify(preferences));
        } catch {}
      };

      let preferences;
      try {
        preferences = JSON.parse(localStorage.getItem(storageKey) || 'null');
      } catch {}
      if (preferences && typeof preferences === 'object') {
        for (const control of controls) {
          if (typeof preferences[key(control)] === 'boolean') {
            control.checked = preferences[key(control)];
          }
        }
      }

      for (const control of controls) {
        control.addEventListener('change', () => {
          save();
          apply();
        });
      }

      document.querySelector('#reset-filters').addEventListener('click', () => {
        for (const control of controls) {
          control.checked = true;
        }
        try {
          localStorage.removeItem(storageKey);
        } catch {}
        apply();
      });
      apply();
    })();
  </script>
</body>
</html>
