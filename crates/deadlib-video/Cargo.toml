[package]
name = "deadlib-video"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[features]
bench-support = []

[[bench]]
name = "video_open_hot_paths"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "video_frame_hot_paths"
harness = false
required-features = ["bench-support"]

[dependencies]
image = "0.25.10"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"


[lints.clippy]
perf = { level = "warn", priority = -1 }

inline_always = "allow"
