[package]
name = "deadlib-lua"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0"
description = "Independent Rust Lua compiler and register interpreter for DeadSync"
repository = "https://github.com/pnn64/deadsync"

[dependencies]

[[test]]
name = "stdio_allocation_failures"
# libtest prints before test entry, warming precisely the global streams whose
# cold allocation behavior this executable must check in fresh child processes.
harness = false

[[bench]]
name = "baseline"
harness = false

[[bench]]
name = "cache"
harness = false

[[bench]]
name = "host_functions"
harness = false

[lints.clippy]
perf = { level = "warn", priority = -1 }
