[package]
name = "deadlib-lua-derive"
version = "0.12.2"
authors = ["Aleksandr Orlenko <zxteam@pm.me>"]
rust-version = "1.88"
edition = "2024"
description = "Procedural macros for the DeadSync-maintained mlua fork."
repository = "https://github.com/pnn64/deadsync"
readme = "README.md"
keywords = ["lua", "mlua"]
license = "MIT"

[lib]
name = "mlua_derive"
proc-macro = true

[features]
macros = []

[dependencies]
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
syn = { version = "2.0", features = ["full"] }
