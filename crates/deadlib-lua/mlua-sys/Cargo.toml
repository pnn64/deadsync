[package]
name = "deadlib-lua-sys"
version = "0.13.0"
authors = ["Aleksandr Orlenko <zxteam@pm.me>"]
rust-version = "1.88"
edition = "2024"
repository = "https://github.com/pnn64/deadsync"
documentation = "https://docs.rs/deadlib-lua-sys"
readme = "README.md"
categories = ["external-ffi-bindings"]
license = "MIT"
links = "lua"
build = "build/main.rs"
description = """
DeadSync-maintained low level Lua, LuaJIT and Luau FFI bindings from mlua-sys
"""

[lib]
name = "mlua_sys"

[package.metadata.docs.rs]
features = ["lua55", "vendored"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
lua55 = []
lua54 = []
lua53 = []
lua52 = []
lua51 = []
luajit = []
luajit52 = ["luajit"]
luau = ["luau0-src"]
luau-codegen = ["luau"]
luau-vector4 = ["luau"]
vendored = ["lua-src", "luajit-src"]
external = []
module = []

[dependencies]
libc = "0.2"

[build-dependencies]
cc = "1.0"
cfg-if = "1.0"
pkg-config = "0.3.17"
lua-src = { version = ">= 551.0.2, < 551.1.0", optional = true }
luajit-src = { version = ">= 210.7.0, < 210.8.0", optional = true }
luau0-src = { version = "0.22.0", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(raw_dylib)'] }
