[package]
name = "deadlib-bincode"
version = "2.0.1"
edition = "2021"
rust-version = "1.86.0"
description = "DeadSync-maintained bincode 2-compatible binary codec"
license = "MIT"
repository = "https://github.com/pnn64/deadsync"
documentation = "https://docs.rs/deadlib-bincode"
readme = "README.md"
categories = ["encoding", "network-programming"]
keywords = ["binary", "encode", "decode", "serialization"]

[lib]
name = "bincode"
path = "src/lib.rs"

[dependencies]
bincode_derive = { package = "deadlib-bincode-derive", version = "=2.0.1", path = "derive" }

[dev-dependencies]
criterion = "0.8.2"
rand = "0.10.2"

[[bench]]
name = "inline"
harness = false

[[bench]]
name = "string"
harness = false

[[bench]]
name = "varint"
harness = false
