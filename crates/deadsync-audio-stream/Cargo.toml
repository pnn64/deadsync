[package]
name = "deadsync-audio-stream"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[[bench]]
name = "audio_sample_transforms"
harness = false

[[bench]]
name = "sfx_control_handoff"
harness = false

[[bench]]
name = "sola_hot_paths"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "music_backpressure"
harness = false
required-features = ["test-support"]

[[bench]]
name = "decoder_buffer_hot_paths"
harness = false
required-features = ["bench-support"]

[features]
bench-support = ["deadsync-audio-decode/bench-support"]
test-support = []

[dependencies]
deadlib-audio-core = { path = "../deadlib-audio-core" }
deadlib-audio = { path = "../deadlib-audio" }
deadsync-audio-decode = { path = "../deadsync-audio-decode" }
deadsync-audio-replaygain = { path = "../deadsync-audio-replaygain" }
deadlib-platform = { path = "../deadlib-platform" }
log = "0.4.34"
rubato = "5.0.0"
smallvec = "1.15.2"

[lints.clippy]
perf = { level = "warn", priority = -1 }

inline_always = "allow"
