[package]
name = "deadlib-render-backend-metal"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[features]
cargo-clippy = []

[target.'cfg(target_os = "macos")'.dependencies]
bytemuck = "1.25.2"
core-graphics-types = "0.2.0"
deadlib-platform = { path = "../deadlib-platform" }
deadlib-render-core = { path = "../deadlib-render-core" }
foreign-types = "0.5.0"
glam = "0.33.6"
image = "0.25.10"
log = "0.4.34"
metal = "0.33.0"
objc = "0.2.7"
winit = "0.30.13"

[dev-dependencies]
deadlib-render-core = { path = "../deadlib-render-core" }

[lints.clippy]
perf = { level = "warn", priority = -1 }

inline_always = "allow"
