[package]
name = "deadsync-lights"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[dependencies]
deadsync-core = { path = "../deadsync-core" }
log = "0.4.35"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Devices_Communication",
    "Win32_Foundation",
] }

[target.'cfg(any(windows, target_os = "linux", target_os = "freebsd", target_os = "macos"))'.dependencies]
deadlib-hid = { path = "../deadlib-hid" }

[lints.clippy]
perf = { level = "warn", priority = -1 }

inline_always = "allow"
