[package]
name = "deadsync-score"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[dependencies]
bincode = { package = "deadlib-bincode", version = "=2.0.1", path = "../deadlib-bincode" }
chrono = "0.4.45"
deadsync-chart = { path = "../deadsync-chart" }
deadsync-core = { path = "../deadsync-core" }
deadsync-rules = { path = "../deadsync-rules" }
hashbrown = { version = "0.17.1", features = ["serde"] }
log = "0.4.34"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smallvec = "1.16.0"

[dev-dependencies]
deadsync-simfile = { path = "../deadsync-simfile" }

[lints.clippy]
perf = { level = "warn", priority = -1 }

inline_always = "allow"
