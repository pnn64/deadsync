[package]
name = "deadlib-lua-legacy"
version = "0.12.2" # remember to update mlua_derive
authors = ["Aleksandr Orlenko <zxteam@pm.me>", "kyren <catherine@kyju.org>"]
rust-version = "1.88"
edition = "2024"
repository = "https://github.com/pnn64/deadsync"
documentation = "https://docs.rs/deadlib-lua-legacy"
readme = "README.md"
keywords = ["lua", "luajit", "luau", "async", "scripting"]
categories = ["api-bindings", "asynchronous"]
license = "MIT"
description = """
DeadSync-maintained mlua fork: high level Lua, LuaJIT and Luau bindings
with async/await and native Lua module support.
"""

[package.metadata.docs.rs]
features = ["lua55", "vendored", "async", "send", "serde", "macros"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "mlua"

[features]
lua55 = ["ffi/lua55"]
lua54 = ["ffi/lua54"]
lua53 = ["ffi/lua53"]
lua52 = ["ffi/lua52"]
lua51 = ["ffi/lua51"]
luajit = ["ffi/luajit"]
luajit52 = ["luajit", "ffi/luajit52"]
luau = ["ffi/luau"]
luau-jit = ["luau", "ffi/luau-codegen"]
luau-vector4 = ["luau", "ffi/luau-vector4"]
vendored = ["ffi/vendored"]
module = ["mlua_derive", "ffi/module"]
async = ["dep:futures-util"]
send = ["error-send"]
error-send = []
serde = ["dep:serde", "dep:erased-serde", "dep:serde-value", "bstr/serde"]
macros = ["mlua_derive/macros", "dep:inventory"]
anyhow = ["dep:anyhow", "error-send"]
userdata-wrappers = ["parking_lot/send_guard"]

# deprecated features
serialize = ["serde"]

[dependencies]
mlua_derive = { package = "deadlib-lua-legacy-derive", version = "=0.12.2", optional = true, path = "mlua_derive" }
bstr = { version = "1.13.1", features = ["std"], default-features = false }
either = "1.19.0"
num-traits = { version = "0.2.19" }
rustc-hash = "2.1.3"
futures-util = { version = "0.3.34", optional = true, default-features = false, features = ["std"] }
serde = { version = "1.0.229", optional = true }
erased-serde = { version = "0.4.11", optional = true }
serde-value = { version = "0.7.0", optional = true }
parking_lot = { version = "0.12.5", features = ["arc_lock"] }
anyhow = { version = "1.0.104", optional = true }
inventory = { version = "0.3.25", optional = true }
libc = "0.2.191"

ffi = { package = "deadlib-lua-legacy-sys", version = "0.13.0", path = "mlua-sys" }

[dev-dependencies]
trybuild = "1.0.122"
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
maplit = "1.0.2"
static_assertions = "1.1.0"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
hyper = { version = "1.12.0", features = ["full"] }
hyper-util = { version = "0.1.21", features = ["full"] }
http-body-util = "0.1.5"
reqwest = { version = "0.13.5", features = ["json"] }
tempfile = "3.27.0"
criterion = { version = "0.8.2", features = ["async_tokio"] }
rustyline = "19.0.0"
tokio = { version = "1.54.1", features = ["full"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)', 'cfg(force_memory_limit)'] }

[[bench]]
name = "benchmark"
harness = false
required-features = ["async"]

[[bench]]
name = "serde"
harness = false
required-features = ["serde"]

[[bench]]
name = "hot_paths"
harness = false

[[example]]
name = "async_http_client"
required-features = ["async", "macros"]

[[example]]
name = "async_http_reqwest"
required-features = ["async", "serde", "macros"]

[[example]]
name = "async_http_server"
required-features = ["async", "macros", "send"]

[[example]]
name = "async_tcp_server"
required-features = ["async", "macros", "send"]

[[example]]
name = "guided_tour"
required-features = ["macros"]

[[example]]
name = "compiled_program"
required-features = ["lua51"]

[[example]]
name = "grouped_program"
required-features = ["lua51"]

[[example]]
name = "prepared_schema"
required-features = ["lua51"]

[[example]]
name = "program_storage"
required-features = ["lua51"]

[[example]]
name = "owned_tables"
required-features = ["lua51"]

[[example]]
name = "serde"
required-features = ["serde"]

[[example]]
name = "userdata"
required-features = ["macros"]
