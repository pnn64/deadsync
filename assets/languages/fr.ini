[OptionsCoinHelp]
CoinMode=Le mode domestique permet de jouer sans limite. Le mode gratuit propose des parties normales ou le mode événement. Le mode payant exige des pièces.
EventMode=Autoriser un nombre illimité de morceaux en mode gratuit. Le mode domestique utilise toujours le mode événement ; le mode payant ne l’utilise jamais.
CoinsPerCredit=Choisir le nombre de pièces nécessaires pour obtenir un crédit en mode payant.
SongsPerPlay=Choisir le nombre initial de morceaux d’une partie normale.
PremiumFree=Activer les parties chronométrées Premium Free avec la durée de session choisie.
PremiumGrace=Autoriser ce dépassement de durée pour un morceau au-delà du compte à rebours Premium Free.
ContinueOnGiveUp=Poursuivre la partie lorsque tous les joueurs abandonnent un morceau.
LongSongTime=Les morceaux dont la durée, après ajustement de la vitesse, atteint ce seuil coûtent deux étapes.
MarathonSongTime=Les morceaux dont la durée, après ajustement de la vitesse, atteint ce seuil coûtent trois étapes.

