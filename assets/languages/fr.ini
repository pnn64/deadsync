ScoreImportEndpointHelp=Choisir le service source des scores.\nGrooveStats, BoogieStats ou ArrowCloud.
ScoreImportProfileHelp=Choisir un profil local avec des identifiants configurés pour ce service.\nGS/BS : clé API et nom d’utilisateur dans groovestats.ini.\nAC : clé API dans arrowcloud.ini.
ScoreImportPackHelp=Choisir le pack installé dont les scores seront importés.\nTous importe les scores de toute la bibliothèque.
ScoreImportOnlyMissingHelp=Si activé, importer uniquement les chorégraphies sans score en cache pour ce service.\nSinon, demander chaque empreinte de chorégraphie sélectionnée.
ScoreImportStartHelp=Importer les scores de ce profil pour le service et les packs choisis.\nLimité à trois requêtes par seconde pour éviter de surcharger l’API.\nL’opération peut dépasser une heure pour une grande bibliothèque.

