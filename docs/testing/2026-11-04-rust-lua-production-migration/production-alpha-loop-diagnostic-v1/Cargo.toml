[workspace]
[package]
name = "production-alpha-loop-control"
version = "0.1.0"
edition = "2024"
[dependencies]
deadsync-rules = { path = "C:/GitHub/deadsync/crates/deadsync-rules" }
deadsync-assets = { path = "C:/GitHub/deadsync/crates/deadsync-assets" }
deadsync-config = { path = "C:/GitHub/deadsync/crates/deadsync-config" }
deadsync-song-lua = { path = "C:/GitHub/deadsync/crates/deadsync-song-lua", features = ["legacy-oracle", "test-support"] }
log = "=0.4.35"
serde_json = "=1.0.154"
[profile.dev]
debug = 0
incremental = false
[patch.crates-io]
# Native actor grids exceed Lua 5.1 C-stack storage used by mlua Rust handles.
# Permit registry-sized ownership on idle auxiliary threads only.
lua-src = { path = "C:/GitHub/deadsync/vendor/lua-src" }
# hidapi's windows-native backend imports GetOverlappedResultEx, which is
# unavailable on Windows 7. The local patch keeps the same backend but uses the
# Win7-compatible overlapped wait sequence.
hidapi = { path = "C:/GitHub/deadsync/vendor/hidapi-win7" }
dirs-sys = { path = "C:/GitHub/deadsync/vendor/dirs-sys-win7" }
# rfd's Windows backend imports CoTaskMemFree from combase.dll through
# windows-sys 0.61. Windows 7 only provides that API from ole32.dll, so the
# local patch resolves it at runtime.
rfd = { path = "C:/GitHub/deadsync/vendor/rfd-win7" }
# Opus must honor Rust's static MSVC runtime; its CMake default selects /MD.
opusic-sys = { path = "C:/GitHub/deadsync/vendor/opusic-sys" }

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

# Song-Lua Sound actors can preload full-length music. Keep their decoder and
# resampler optimized so development builds do not block loading for minutes.
[profile.dev.package.deadlib-audio]
opt-level = 3

[profile.dev.package.deadlib-audio-decode]
opt-level = 3

[profile.dev.package.rubato]
opt-level = 3

[profile.dev.package.symphonia-core]
opt-level = 3

[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3

# Full-song fixtures verify large native traces and every archive member.
# Keep SHA-256 fast when running the default cargo test profile.
[profile.dev.package.sha2]
opt-level = 3

# Retained modcharts update dense meshes during gameplay. Keep the scene bridge
# and its VM optimized while retaining development debug symbols and checks.
[profile.dev.package.deadsync-song-lua]
opt-level = 3

[profile.dev.package.deadlib-lua-legacy]
opt-level = 3

[profile.dev.package.deadlib-lua-legacy-sys]
opt-level = 3


[profile.dev.package.deadlib-lua]
opt-level = 3
